# Rubric weights + runtime settings. Kept out of rubric.ts so it can be
# tuned without touching code.

llm:
  provider: groq # groq | openai | gemini — fallback if no --provider flag passed
  # model / fallback_model are NOT set here — they come from PROD_MODEL /
  # PROD_FALLBACK_MODEL in .env. Keeps model names in one file, so swapping
  # one after a rate limit doesn't mean hunting through code or config.
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  temperature: 0.5
  max_tokens: 4096
  batch_size: 5 # Groq free tier caps at 8000 tokens/min, 5 leads/call is reliable
  delay_between_batches_ms: 8000
  max_attempts: 4
  timeout_ms: 60000

# auto = use the newest date in the file, not today's real date. Sample data
# is from Jan 2024, so scoring against today would make every lead look stale.
reference_date: auto

# Weights sum to 1.0.
weights:
  company_size: 0.30
  industry_fit: 0.20
  source_quality: 0.25
  recency: 0.15
  data_completeness: 0.10

# Company size (employees -> 1-10). First band whose max fits wins.
company_size_bands:
  - { max: 9, score: 2 }
  - { max: 49, score: 6 }
  - { max: 500, score: 10 } # sweet spot
  - { max: 2000, score: 8 }
  - { max: 10000, score: 5 }
  - { max: null, score: 2 }
company_size_missing_score: 4

# Industry fit. Unmapped industries score neutral, not penalized.
industry_tiers:
  tier_a_score: 10
  tier_a: [SaaS, Software, Technology, Enterprise Software, FinTech, Cybersecurity, Analytics, Data]
  tier_b_score: 6
  tier_b: [Finance, Healthcare, EdTech, Insurance, Retail, Logistics, Manufacturing, Supply Chain, Consulting, Marketing, Media, Real Estate, Travel, Energy, Pharmaceuticals, Education,]
  tier_c_score: 2
  tier_c: [Agriculture, Hospitality, Events, Legal, Government, Construction, Non-profit]
  unknown_score: 4

# Source quality — our only signal for buying intent.
source_scores:
  "Inbound demo request": 10
  "Referral": 8
  "Webinar attendee": 6
  "Sales call": 6
  "Content download": 4
  "LinkedIn outreach": 2
  default: 2

# Recency: days since last_interaction_date.
recency_bands:
  - { max: 7, score: 10 }
  - { max: 30, score: 8 }
  - { max: 90, score: 5 }
  - { max: 180, score: 2 }
  - { max: null, score: 1 }
recency_missing_score: 2

# Data completeness: (fields present / 6) * 10, over name/company/
# company_size/industry/source/last_interaction_date.

decision_thresholds:
  qualified_min: 8.0
  review_min: 7.0 # [review_min, qualified_min) -> review; below -> rejected
  insufficient_data_completeness_max: 3.4 # <= 2 of 6 fields present

# Can only downgrade "qualified" to "review", never upgrade.
hard_filters:
  min_company_size_for_qualified: 10
  max_company_size_for_qualified: 10000
  require_known_company_size: true

priority_tiers:
  - { min: 9.0, tier: P1 }
  - { min: 8.0, tier: P2 }
  - { min: 0.0, tier: P3 }
